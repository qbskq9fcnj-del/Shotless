name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Sign, notarize and publish to the existing v* release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Clean Apple credentials (strip whitespace)
        if: ${{ env.PUBLISH == 'true' }}
        env:
          RAW_APPLE_ID: ${{ secrets.APPLE_ID }}
          RAW_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          RAW_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            raw_var="RAW_$name"
            clean=$(printf '%s' "${!raw_var}" | tr -d '[:space:]')
            echo "::add-mask::$clean"
            echo "$name=$clean" >> "$GITHUB_ENV"
          done
      - name: Build, sign and notarize
        if: ${{ env.PUBLISH == 'true' }}
        run: npm run build && npx electron-builder --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Upload dmg to the release
        if: ${{ env.PUBLISH == 'true' }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Shotless $tag" --notes ""
          fi
          gh release upload "$tag" release/*.dmg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build only (unsigned)
        if: ${{ env.PUBLISH != 'true' }}
        run: npm run build && npx electron-builder --publish never -c.mac.notarize=false -c.mac.identity=null
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check icon is bundled
        if: ${{ env.PUBLISH != 'true' }}
        run: |
          app=$(ls -d release/mac*/Shotless.app | head -1)
          ls "$app/Contents/Resources" | grep -E 'Assets.car|icns'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$app/Contents/Info.plist"
      - name: Upload unsigned dmg
        if: ${{ env.PUBLISH != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: shotless-unsigned
          path: release/*.dmg
