<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #flash { position: fixed; inset: 0; background: #000; opacity: 0; animation: dim 340ms cubic-bezier(0.22, 0.61, 0.36, 1) forwards; }
  @keyframes dim { 0% { opacity: 0; } 22% { opacity: 0.22; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div id="flash"></div>
<script>
  // 柔らかい「ポッ」という音を Web Audio で合成して鳴らす(音声ファイル不要)
  (function () {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    var ctx = new Ctx();
    var t = ctx.currentTime;

    var osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(720, t);
    osc.frequency.exponentialRampToValueAtTime(260, t + 0.09);

    var gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.32, t + 0.006);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.16);
  })();
</script>
</body>
</html>
