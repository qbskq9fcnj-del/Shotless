<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="flash"></div>
<script>
  // シャッター音を Web Audio で合成して鳴らす(音声ファイル不要)。
  // AudioContext は読み込み時に1回だけ作る。
  var ctx = null;
  try {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx) ctx = new Ctx();
  } catch (e) {
    ctx = null;
  }
  var flash = document.getElementById('flash');

  function click(now, offset, freq, dur, vol) {
    var len = Math.floor(ctx.sampleRate * dur);
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    }
    var src = ctx.createBufferSource();
    src.buffer = buf;
    var filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = freq;
    filter.Q.value = 0.9;
    var gain = ctx.createGain();
    gain.gain.value = vol;
    src.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    src.start(now + offset);
  }

  function thump(now) {
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(90, now + 0.05);
    g.gain.setValueAtTime(0.5, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.07);
  }

  // 撮影のたびに呼ばれる。フラッシュを出して音を鳴らす。
  function playFlash() {
    if (ctx && ctx.resume) ctx.resume().catch(function () {});
    flash.getAnimations().forEach(function (a) { a.cancel(); });
    flash.animate([{ opacity: 0.8 }, { opacity: 0 }], { duration: 180, easing: 'ease-out' });
    if (!ctx) return;
    var now = ctx.currentTime;
    thump(now);
    click(now, 0, 3200, 0.05, 0.5);
    click(now, 0.07, 1800, 0.08, 0.45);
  }

  if (window.shotlessOverlay) window.shotlessOverlay.onCaptureStart(playFlash);
</script>
</body>
</html>
